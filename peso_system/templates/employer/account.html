{% extends 'base_employer.html' %}
{% block title %}Manage Account{% endblock %}

{% block content %}
<div class="mb-4">
  <h4 class="fw-bold mb-0">Manage Your Account</h4>
  <p class="text-muted small mb-0">Update your account details or change your password.</p>
</div>

<div class="card shadow-sm border-0 mb-3 mx-auto" style="max-width:560px;border-radius:12px;">
  <div class="card-body p-4">
    <p class="fw-semibold text-muted mb-3" style="font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;">Account</p>
    <form method="POST" action="{{ url_for('employer_account') }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Full name</label>
        <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required />
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email address</label>
        <input type="email" name="email" class="form-control" value="{{ user.email }}" required />
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">User account type</label>
        <input type="text" class="form-control" value="Employer" disabled readonly />
      </div>
      <button type="submit" class="btn btn-success fw-semibold">
        <i class="bi bi-check2 me-1"></i>Save changes
      </button>
    </form>
  </div>
</div>

<div class="card shadow-sm border-0 mx-auto" style="max-width:560px;border-radius:12px;">
  <div class="card-body p-4 d-flex align-items-center justify-content-between">
    <div>
      <div class="fw-semibold">Password</div>
      <div class="text-muted small">Change your account password.</div>
    </div>
    <a href="{{ url_for('change_password') }}" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-key me-1"></i>Change password
    </a>
  </div>
</div>
{% endblock %}
