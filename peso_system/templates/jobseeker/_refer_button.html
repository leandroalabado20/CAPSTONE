{% if vac.vacancy_id in rejected_ids %}
<span class="badge flex-shrink-0" style="background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;">
  <i class="bi bi-x-circle-fill me-1"></i>Not Selected
</span>
{% elif vac.vacancy_id in applied_ids %}
<span class="badge bg-success-subtle text-success-emphasis flex-shrink-0">
  <i class="bi bi-check-circle me-1"></i>Applied
</span>
{% elif at_referral_limit %}
<button type="button" class="btn btn-secondary btn-sm py-0 px-2 flex-shrink-0" style="font-size:.72rem;"
        disabled title="Withdraw an application to apply to another job">
  <i class="bi bi-lock-fill me-1"></i>Limit Reached
</button>
{% else %}
<a href="{{ url_for('jobseeker_apply_confirm', vid=vac.vacancy_id) }}"
   class="btn btn-success btn-sm py-0 px-2 flex-shrink-0" style="font-size:.72rem;">
  <i class="bi bi-send-fill me-1"></i>Apply
</a>
{% endif %}
