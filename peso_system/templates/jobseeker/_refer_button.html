{% if vac.id in applied_ids %}
<span class="badge bg-success-subtle text-success-emphasis flex-shrink-0">
  <i class="bi bi-check-circle me-1"></i>Applied
</span>
{% else %}
<form method="POST" action="{{ url_for('jobseeker_apply') }}" class="flex-shrink-0">
  <input type="hidden" name="vacancy_id" value="{{ vac.id }}" />
  <button type="submit" class="btn btn-success btn-sm py-0 px-2" style="font-size:.72rem;"
          onclick="return confirm('Apply for this job? Your referral slip will be generated immediately.')">
    <i class="bi bi-send-fill me-1"></i>Apply
  </button>
</form>
{% endif %}
