{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block page_title %}<i class="bi bi-key-fill me-2"></i>Change Password{% endblock %}

{% block content %}
<div class="card shadow-sm" style="max-width:460px;">
  <div class="card-header fw-semibold">Change Your Password</div>
  <div class="card-body">
    <form method="POST" action="{{ url_for('change_password') }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Current Password <span class="text-danger">*</span></label>
        <input type="password" name="current_password" class="form-control"
               required autocomplete="current-password" />
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">New Password <span class="text-danger">*</span></label>
        <input type="password" name="new_password" class="form-control"
               required minlength="8" autocomplete="new-password" />
        <div class="form-text">Minimum 8 characters.</div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Confirm New Password <span class="text-danger">*</span></label>
        <input type="password" name="confirm_password" class="form-control"
               required autocomplete="new-password" />
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary fw-semibold">
          <i class="bi bi-save me-1"></i>Change Password
        </button>
        <a href="{{ url_for('recommendation') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
